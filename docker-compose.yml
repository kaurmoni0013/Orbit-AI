services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/chatgpt-clone
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      - mongo
      - redis
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mongo-data:
